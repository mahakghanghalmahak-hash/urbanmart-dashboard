<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UrbanMart Business Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f3f5fa;color:#202943}

header{background:#172554;color:white;padding:25px 5%}

header h1{margin:0 0 8px}

header p{margin:0;color:#dbeafe}

main{max-width:1200px;margin:auto;padding:25px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}

.card,.panel{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 12px #17255412}

.card h3{font-size:14px;color:#64748b;margin:0 0 12px}

.value{font-size:25px;font-weight:bold;color:#1d4ed8}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:20px}

.panel h2{font-size:17px;margin-top:0}

canvas{max-height:290px}

footer{text-align:center;padding:25px;color:#64748b;font-size:13px}

</style>
